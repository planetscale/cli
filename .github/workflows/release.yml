name: Release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    # This workflow should always be run on main - this is enforced by the
    # `release` environment directly but added here for visibility.
    # If the workflow fails during publishing, a new release must be published
    if: github.ref == 'refs/heads/main' && github.run_attempt == '1'

    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read

    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.CLI_APP_ID }}
          private-key: ${{ secrets.CLI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          owner: planetscale
          repositories: |
            cli
            homebrew-tap
            scoop-bucket

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache: false

      - name: Configure Git
        run: |
          git config user.name "planetscale-cli[bot]"
          git config user.email "272331943+planetscale-cli[bot]@users.noreply.github.com"

      - name: Bump version and push tag
        id: bump
        run: script/bump-version.sh

      - name: Publish artifacts
        id: publish
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GORELEASER_CURRENT_TAG: ${{ steps.bump.outputs.RELEASE_VERSION }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: script/release.sh

      - name: Post the tap pull requests
        # The release is already published, and this job cannot be rerun.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.OPS_SLACK_WEBHOOK_URL }}
          RELEASE_VERSION: ${{ steps.bump.outputs.RELEASE_VERSION }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: script/notify-release.sh

      - name: Post a release failure
        if: failure() && steps.publish.outcome != 'success'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.OPS_SLACK_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          RELEASE_VERSION: ${{ steps.bump.outputs.RELEASE_VERSION }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "error: OPS_SLACK_WEBHOOK_URL is not set on the release environment" >&2
            exit 1
          fi
          if [ -n "${RELEASE_VERSION:-}" ]; then
            text=$(printf 'CLI %s failed. %s started it: %s' "$RELEASE_VERSION" "$ACTOR" "$RUN_URL")
          else
            text=$(printf 'CLI release failed. %s started it: %s' "$ACTOR" "$RUN_URL")
          fi
          payload=$(jq -n --arg text "$text" '{text: $text}')
          curl -sfS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
