name: Sync client to planetscale-go

# The API client at internal/planetscale is canonical (see doc/api-client.md).
# This workflow copies it into planetscale/planetscale-go and opens a PR there
# so external users of the module can pick up new endpoints. It never pushes
# to main directly. Cursor PR Routing & Approval (see APPROVAL_POLICY.md in
# planetscale-go) can approve mechanical sync PRs; this job enables GitHub
# auto-merge so the PR merges once that approval and required checks land.
# Version tagging after merge remains a separate step (use the gorelease
# report in the PR body).
#
# Auth comes from the CLI GitHub App (same as release.yml); the app must be
# installed on planetscale-go with contents and pull request write access.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # The CLI app credentials (CLI_APP_ID, CLI_APP_PRIVATE_KEY) are scoped to
    # the release environment. This job only reads secrets and deploys
    # nothing, so skip creating deployment records.
    environment:
      name: release
      deployment: false
    steps:
      - uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ vars.CLI_APP_ID }}
          private-key: ${{ secrets.CLI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          owner: planetscale
          repositories: planetscale-go

      - name: Check out cli
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: cli

      - name: Check out planetscale-go
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: planetscale/planetscale-go
          token: ${{ steps.app-token.outputs.token }}
          path: planetscale-go
          # gorelease needs the tag history to find the base version.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: cli/go.mod

      - name: Sync client files
        run: ./cli/script/sync-planetscale-go.sh cli planetscale-go

      - name: Check for changes
        id: changes
        working-directory: planetscale-go
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "planetscale-go is already up to date"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Build and test synced copy
        if: steps.changes.outputs.changed == 'true'
        working-directory: planetscale-go
        run: |
          go mod tidy
          go build ./...
          go test ./...

      - name: Commit to sync branch
        if: steps.changes.outputs.changed == 'true'
        id: commit
        working-directory: planetscale-go
        run: |
          source_sha=$(git -C ../cli rev-parse --short HEAD)
          branch="sync-cli-${source_sha}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          # Set before the early exit: the re-push step amends a commit and so
          # needs an identity on re-runs where the branch already exists.
          git config user.name "planetscale-cli[bot]"
          git config user.email "272331943+planetscale-cli[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Branch $branch already exists, nothing to do"
            exit 0
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"
          git checkout -b "$branch"
          git add -A
          git commit -m "Sync API client from planetscale/cli@${source_sha}"

      - name: API compatibility report
        if: steps.changes.outputs.changed == 'true' && steps.commit.outputs.exists == 'false'
        working-directory: planetscale-go
        run: |
          # gorelease requires a clean tree, hence running after the commit.
          go install golang.org/x/exp/cmd/gorelease@latest
          base=$(git describe --tags --abbrev=0)
          echo "Comparing against $base"
          {
            echo '## gorelease report (base: '"$base"')'
            echo '```'
            gorelease -base="$base" 2>&1 || true
            echo '```'
          } > /tmp/gorelease-report.md
          cat /tmp/gorelease-report.md

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true' && steps.commit.outputs.exists == 'false'
        working-directory: planetscale-go
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          source_sha=$(git -C ../cli rev-parse --short HEAD)
          branch="${{ steps.commit.outputs.branch }}"
          git push origin "$branch"
          {
            echo "Automated sync of the API client from planetscale/cli@${source_sha}."
            echo
            echo "The client in the cli repo (internal/planetscale) is the source of"
            echo "truth; this repo is a read-only mirror for external module users."
            echo
            echo "Auto-merge is enabled. Cursor Approval Agent may approve per"
            echo "APPROVAL_POLICY.md. Use the gorelease report below when choosing"
            echo "the next tag; incompatible changes need a matching semver bump."
            echo
            cat /tmp/gorelease-report.md
          } > /tmp/pr-body.md
          gh pr create \
            --repo planetscale/planetscale-go \
            --head "$branch" \
            --title "Sync API client from cli@${source_sha}" \
            --body-file /tmp/pr-body.md

      # Cursor Approval Agent has never started from the "PR opened" event in
      # planetscale-go; every run there began within seconds of a push to an
      # already-open PR. Amending republishes the same tree under a new SHA so
      # the push trigger fires. This works from the remote branch tip rather
      # than the local HEAD, so re-runs where the branch already exists (and the
      # commit step exited early) still emit a push.
      - name: Re-push sync commit to trigger review automation
        if: steps.changes.outputs.changed == 'true'
        working-directory: planetscale-go
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          branch="${{ steps.commit.outputs.branch }}"
          pr_json=$(gh pr view --repo planetscale/planetscale-go "$branch" \
            --json state,reviews 2>/dev/null || echo '{}')
          state=$(printf '%s' "$pr_json" | jq -r '.state // "NONE"')
          if [ "$state" != "OPEN" ]; then
            echo "PR for $branch is $state; nothing to re-push"
            exit 0
          fi
          approvals=$(printf '%s' "$pr_json" | jq '[(.reviews // [])[] | select(.state == "APPROVED")] | length')
          if [ "$approvals" -gt 0 ]; then
            echo "PR for $branch is already approved; nothing to re-push"
            exit 0
          fi
          git fetch origin "$branch"
          before=$(git rev-parse FETCH_HEAD)
          git checkout -f -B "$branch" "$before"
          # An amend landing in the same second as the original commit yields an
          # identical SHA, which would make the push a no-op.
          for _ in 1 2 3; do
            git commit --amend --no-edit --date=now
            if [ "$(git rev-parse HEAD)" != "$before" ]; then
              break
            fi
            sleep 1
          done
          if [ "$(git rev-parse HEAD)" = "$before" ]; then
            echo "Could not produce a new commit SHA; the approval agent may not run"
            exit 0
          fi
          git push --force-with-lease="$branch:$before" origin "$branch"

      # Runs for both newly created sync PRs and re-runs where the branch
      # already exists (e.g. create succeeded but enabling auto-merge failed).
      - name: Enable auto-merge
        if: steps.changes.outputs.changed == 'true'
        working-directory: planetscale-go
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          branch="${{ steps.commit.outputs.branch }}"
          pr_json=$(gh pr view --repo planetscale/planetscale-go "$branch" \
            --json url,state,autoMergeRequest)
          state=$(printf '%s' "$pr_json" | jq -r .state)
          if [ "$state" != "OPEN" ]; then
            echo "PR for $branch is $state; nothing to do"
            exit 0
          fi
          if [ "$(printf '%s' "$pr_json" | jq -r '.autoMergeRequest != null')" = "true" ]; then
            echo "Auto-merge already enabled for $branch"
            exit 0
          fi
          pr_url=$(printf '%s' "$pr_json" | jq -r .url)
          gh pr merge --repo planetscale/planetscale-go --auto --merge "$pr_url"
